name: Build and Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*' # Triggers workflow on tag creation (e.g., v1.0, v1.0.1)
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

permissions:
  contents: write # Required to create a release

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          # This action will install a specific Gradle version if gradlew is not present
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: .

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: app-debug.apk
          tag_name: "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.0-build-{0}', github.run_number) }}"
          name: "${{ startsWith(github.ref, 'refs/tags/') && format('Release {0}', github.ref_name) || format('BrezzaCarLink Build #{0}', github.run_number) }}"
          generate_release_notes: true
          draft: false
          prerelease: "${{ !startsWith(github.ref, 'refs/tags/') }}"
